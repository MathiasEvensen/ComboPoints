name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  # Lets the packager create the GitHub release for the tag.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The packager fills @project-version@ with the tag verbatim, "v" included.
      - name: Set TOC version without the v prefix
        run: sed -i "s/@project-version@/${GITHUB_REF_NAME#v}/" ComboPoints.toc

      - name: Package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Supplied automatically by Actions; nothing to create or store.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
